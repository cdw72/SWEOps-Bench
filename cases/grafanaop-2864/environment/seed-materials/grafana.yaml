apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    instance: grafana
spec:
  # version 必须钉死:operator 用它拼默认镜像 docker.io/grafana/grafana:<version>,
  # 只有 13.x 才有 App Platform API(*.grafana.app);
  # feature_toggles.alertingMultiplePolicies 是 RoutingTree 这组 API 的开关。
  version: 13.0.1
  config:
    log:
      mode: "console"
    security:
      admin_user: root
      admin_password: secret
    feature_toggles:
      enable: alertingMultiplePolicies
