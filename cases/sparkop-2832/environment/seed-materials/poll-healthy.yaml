apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-volcano
  namespace: default
spec:
  type: Scala
  mode: cluster
  image: apache/spark:3.5.0
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  # apache/spark:3.5.0 里 examples jar 的真名是 spark-examples_2.12-3.5.0.jar
  # (spark-examples.jar 只存在于上游 spark-operator 自改的示例镜像) —— 写错名字
  # 会让 driver 永久 Failed,健康相位就自带一条结构性 ⚠。2026-09-20 实测 tar 确认。
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.0.jar
  sparkVersion: 3.5.0
  dynamicAllocation:
    enabled: true
    initialExecutors: 1
    minExecutors: 1
    maxExecutors: 3
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
  executor:
    cores: 1
    memory: 512m
