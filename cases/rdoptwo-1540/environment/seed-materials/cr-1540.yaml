apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: rc
spec:
  clusterSize: 3
  clusterVersion: v7
  persistenceEnabled: false
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  initContainer:
    enabled: true
    image: busybox:1.36
    command: ["sleep", "10"]
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
