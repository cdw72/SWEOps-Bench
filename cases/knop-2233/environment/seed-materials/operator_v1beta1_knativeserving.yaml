apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
# ★ 2026-09-24:与 poll-healthy.yaml 同一块。注入走客户端 apply,last-applied 只摘
#   `spec.deployments`(健康基线独有),本块两相位都在 ⇒ 注入**不会**把 istio 插件
#   重新打开。不显式关掉的话,算子会 apply net-istio.yaml 里的 Gateway 而集群没有
#   该 CRD ⇒ CR 常驻 Ready=False(见 poll-healthy.yaml 的注释)。
spec:
  ingress:
    istio:
      enabled: false
