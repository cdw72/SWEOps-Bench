# vmop-2384 N3 self-contained env (k3s v1.28 = V128 collection node).
# Operator: VictoriaMetrics/operator v0.73.1 (VMOperator), VMSingle CR fault.
services:
  k3s:
    image: rancher/k3s:v1.28.10-k3s1
    privileged: true
    hostname: k3s
    tmpfs:
      - /run
      - /var/run
    volumes:
      - ctr-sock:/run/k3s/containerd
      - k3s-kc:/seed-kc
      # k3s's own PKI dir, shared with `main`: the stale-view cases need to
      # sign a serving cert with THIS cluster's CA, because the operator pods
      # trust it via their serviceaccount ca.crt and nothing else. Empty and
      # unused for every other case.
      - k3s-tls:/var/lib/rancher/k3s/server/tls
    environment:
      - K3S_TOKEN=sweops-seed-token
      - K3S_KUBECONFIG_OUTPUT=/seed-kc/kubeconfig
    command:
      - server
      - --cluster-init
      - --tls-san
      - k3s
      - --disable
      - traefik,servicelb,metrics-server
      - --kubelet-arg=image-gc-high-threshold=100
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "python3 /opt/seed.py && sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seed-done"]
      interval: 5s
      timeout: 3s
      retries: 720
    volumes:
      - ctr-sock:/run/k3s/containerd:ro
      - ctr-sock-1:/run/k3s/ctr-w1:ro
      - ctr-sock-2:/run/k3s/ctr-w2:ro
      - k3s-kc:/seed-kc:ro
      - k3s-tls:/k3s-tls:ro
    environment:
      - SWEOPS_SEED_PHASE=pre
      - K3S_SERVER=https://k3s:6443
    depends_on:
      k3s:
        condition: service_started
  k3s-worker-1:
    image: rancher/k3s:v1.28.10-k3s1
    privileged: true
    hostname: k3s-worker-1
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_URL=https://k3s:6443
      - K3S_TOKEN=sweops-seed-token
    command:
      - agent
      - --kubelet-arg=image-gc-high-threshold=100
    volumes:
      - ctr-sock-1:/run/k3s/containerd
    depends_on:
      k3s:
        condition: service_started
  k3s-worker-2:
    image: rancher/k3s:v1.28.10-k3s1
    privileged: true
    hostname: k3s-worker-2
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_URL=https://k3s:6443
      - K3S_TOKEN=sweops-seed-token
    command:
      - agent
      - --kubelet-arg=image-gc-high-threshold=100
    volumes:
      - ctr-sock-2:/run/k3s/containerd
    depends_on:
      k3s:
        condition: service_started

volumes:
  ctr-sock-1:
  ctr-sock-2:
  ctr-sock:
  k3s-kc:
  k3s-tls:
