# ★ 2026-09-22 单节点保真:五个副本段(rs0 主段 / arbiter / nonvoting / cfgrs / mongos)
# 一律 `affinity.antiAffinityTopologyKey: none`。原样保留 `kubernetes.io/hostname` 时,
# 单节点 k3s 上每个副本集的第 2 个 pod 因反亲和永 Pending(实测:rs0-1 / rs0-nv-1 / cfg-1
# 自 11:27 起 0/1 nodes are available: 1 node(s) didn't match pod anti-affinity rules),
# 健康闸顶格 903.8s 仍无健康相位 ⇒ 案子的术前基线根本不存在。
# 同 k8spsmdb-1154(2026-09-20)的做法;算子侧依据:AffinityOff="none" 在
# pkg/psmdb/statefulset.go:179 直接把反亲和关掉。
# 母本在 harbor-dataset/(用户红线:不动),所以这一刀落在发射期 overlay。
apiVersion: psmdb.percona.com/v1-12-0
kind: PerconaServerMongoDB
metadata:
  finalizers:
  - delete-psmdb-pods-in-order
  name: test-cluster
spec:
  allowUnsafeConfigurations: false
  backup:
    enabled: true
    image: percona/percona-backup-mongodb:1.7.0
    pitr:
      compressionLevel: 6
      compressionType: gzip
      enabled: true
    serviceAccountName: percona-server-mongodb-operator
    tasks:
    - compressionLevel: 6
      compressionType: gzip
      enabled: true
      keep: 3
      name: daily-s3-us-west
      schedule: 0 0 * * *
      storageName: s3-us-west
  crVersion: 1.12.0
  image: percona/percona-server-mongodb:4.4.10-11
  imagePullPolicy: IfNotPresent
  multiCluster:
    DNSSuffix: svc.clusterset.local
    enabled: false
  pmm:
    enabled: false
    image: percona/pmm-client:2.24.0
    serverHost: monitoring-service
  replsets:
  - arbiter:
      affinity:
        antiAffinityTopologyKey: none
      enabled: true
      size: 2
    expose:
      enabled: true
      exposeType: ClusterIP
    # ★ 2026-09-22:rs0 主副本段原本**没写** affinity ⇒ 算子默认
    # 钉 `kubernetes.io/hostname`(psmdb_defaults.go:770 reconcileAffinityOpts,
    # defaultAffinityTopologyKey)——单节点 k3s 上第二个 pod 永远排不下。
    affinity:
      antiAffinityTopologyKey: none
    name: rs0
    nonvoting:
      affinity:
        antiAffinityTopologyKey: none
      configuration: "operationProfiling:\n  mode: slowOp\nsystemLog:\n  verbosity:\
        \ 1\n"
      enabled: true
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 300m
          memory: 0.5G
      size: 2
      volumeSpec:
        persistentVolumeClaim:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi
          storageClassName: standard
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      limits:
        cpu: 300m
        memory: 0.5G
      requests:
        cpu: 300m
        memory: 0.5G
    size: 2
    storage:
      engine: mmapv1
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi
        storageClassName: standard
  secrets:
    encryptionKey: my-cluster-name-mongodb-encryption-key
    users: my-cluster-name-secrets
  sharding:
    configsvrReplSet:
      affinity:
        antiAffinityTopologyKey: none
      expose:
        enabled: true
        exposeType: ClusterIP
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 300m
          memory: 0.5G
      size: 2
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
    enabled: true
    mongos:
      affinity:
        antiAffinityTopologyKey: none
      expose:
        exposeType: ClusterIP
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          cpu: 300m
          memory: 0.5G
        requests:
          cpu: 300m
          memory: 0.5G
      size: 2
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: 4.4-never
    schedule: 0 2 * * *
    setFCV: false
    versionServiceEndpoint: https://check.percona.com
