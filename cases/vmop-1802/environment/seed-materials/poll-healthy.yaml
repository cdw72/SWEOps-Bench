apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
  namespace: default
spec:
  image:
    repository: victoriametrics/vmagent
    tag: v1.129.0
  remoteWrite:
  - url: "http://vmsingle-vmsingle-2384.default.svc:8429/api/v1/write"
    inlineUrlRelabelConfig:
    - sourceLabels: ["__name__", "instance"]
      regex: "sa1_metric_0000_.*"
      action: keep
    - sourceLabels: ["__name__", "instance"]
      regex: "sa1_metric_0001_.*"
      action: keep
  - url: "http://vmsingle-vmsingle-2384.default.svc:8429/api/v1/write"
    inlineUrlRelabelConfig:
    - sourceLabels: ["__name__", "instance"]
      regex: "sa2_metric_0000_.*"
      action: keep
    - sourceLabels: ["__name__", "instance"]
      regex: "sa2_metric_0001_.*"
      action: keep
