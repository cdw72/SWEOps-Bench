# rdoptwo-1863 env fidelity: the two objects the Acto capture env had and the
# packaged seed was missing.
#
# The corpus RedisCluster (mutated-000/001) carries spec.TLS with
# secretName=redis-tls-cert and redisLeader/redisFollower
# redisConfig.additionalRedisConfig=redis-tls-config. Neither object is created
# anywhere in the seed, so at smoke time leader-0 sat in ContainerCreating
# forever:
#   MountVolume.SetUp failed for volume "tls-certs" : secret "redis-tls-cert" not found
#   MountVolume.SetUp failed for volume "external-config" : configmap "redis-tls-config" not found
# The seed's cr_sequence wait (get sts test-cluster-leader + get pods Running)
# still passed, because the operator's own pod satisfies "Running" -- so the
# fault was never injected at all: both recovery probes read the buggy side of
# NOTHING ("status.state Initializing" only because no redis ever started, and
# the SSL-rejection log signature at 0), and the run ended VACUOUS.
#
# Live receipt (2026-09-13 19:1x, retry-wave smoke, in-flight):
#   NAME           CLUSTERSIZE READYLEADER READYFOLLOWER STATE        AGE  REASON
#   test-cluster   3           0           0             Initializing 13m  RedisCluster is initializing leaders
#   test-cluster-leader-0  0/1  ContainerCreating  13m
#
# `redis-tls-config` is byte-exact from the Acto capture
# (runs/rdoptwo-1863/trial-00-0000/system-state-000.json -> config_map), which
# is what makes this a genuine TLS case: tls-auth-clients yes is the switch
# that makes the operator's own redis-cli (issued WITHOUT a client certificate
# by the buggy getRedisTLSArgs) get its handshake rejected. The Secret was not
# collected by the telemetry recorder, so this is a fresh self-signed pair;
# ca.crt == tls.crt, i.e. the cert is its own CA, so both the server's
# `--cacert /tls/ca.crt` and the pods' client-cert probes validate. SANs cover
# every hostname the probes and the operator use (bare pod names, because the
# probes talk to `-h $(hostname)`).
#
# Applied as a `pre_manifests` entry, i.e. BEFORE the operator bundle: the
# namespace block is why the objects can be created that early (seed.py step 4
# only ensures the namespace afterwards, with an idempotent `apply`).
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-tls-config
  namespace: redis-operator
data:
  redis-additional.conf: |
    tls-auth-clients yes
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-tls-cert
  namespace: redis-operator
type: kubernetes.io/tls
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
