apiVersion: sparkoperator.k8s.io/v1alpha1
kind: SparkConnect
metadata:
  name: sc
  namespace: default
spec:
  sparkVersion: 3.5.0
  # ---- 载荷替身(2026-09-22,与 cr-2807.yaml 同一刀;详见那份的注释块) ------
  # 真载荷 `apache/spark:3.5.0` 里没有 spark-connect jar ⇒ connect server 起不来
  # (`Failed to load class ...SparkConnectServer`)⇒ 这个"健康 CR"自己也带
  # CrashLoopBackOff ⇒ k=0 相位不可能有干净的健康基线。故障在**算子**里
  # (imageOption 在 nil 检查之前解引用 executor template),载荷与故障无关,
  # 故三处 image 一律换成 sweops/spark-stub:v1(自带 /bin/bash 替身,不真跑
  # Spark)。★ 注意:sparkoperator 的 sparkconnect 控制器**不挂任何探测**
  # (全树 grep 无 ReadinessProbe/LivenessProbe/StartupProbe),所以替身不需要
  # 答 /health —— 这与 vmop-2356 的 vmanomaly-stub 不同,别照抄那一条。
  # 两份 CR 必须同一个镜像,否则注入的差异就不只是"摘掉 executor template"。
  image: sweops/spark-stub:v1
  server:
    template:
      spec:
        containers:
        - name: spark-kubernetes-driver
          image: sweops/spark-stub:v1
        serviceAccount: spark-operator-spark
  executor:
    template:
      spec:
        containers:
        - name: spark-kubernetes-executor
          image: sweops/spark-stub:v1
    instances: 2
    cores: 1
    memory: 512m
